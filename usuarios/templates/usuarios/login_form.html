{% load static %}
{% load crispy_forms_tags %}
<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Iniciar Sesión - Vet Arica</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css"
      rel="stylesheet"
    />
    <link href="{% static 'usuarios/css/login.css' %}" rel="stylesheet" />
  </head>
  <body>
    <div class="auth-wrap">
    <form class="form" method="post" novalidate>
      {% csrf_token %}
      <a href="{% url 'home' %}" class="auth-back-link">
        Volver al inicio
      </a>
      <img
        src="{% static 'inicio/img/logo.jpg' %}"
        alt="Vet Arica"
        class="auth-logo"
      />
      <p class="form-title">Inicia sesión en tu cuenta</p>

      {{ form.username|as_crispy_field }}
      {{ form.password|as_crispy_field }}

      <p class="signup-link">
        <a href="{% url 'password_reset' %}">¿Olvidaste tu contraseña?</a>
      </p>

      <button type="submit" class="submit">Iniciar sesión</button>

      <p class="signup-link">
        ¿No tienes cuenta?
        <a href="{% url 'registro' %}">Regístrate</a>
      </p>
    </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
    <script>
      const notyf = new Notyf({
        duration: 3000,
        position: { x: "center", y: "top" },
      });

      {% for message in messages %}
      notyf.{% if message.tags == 'success' %}success{% else %}error{% endif %}("{{ message|escapejs }}");
      {% endfor %}
    </script>
  </body>
</html>
