{% load static %}
<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Recuperar Contraseña - Vet Arica</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link href="{% static 'usuarios/css/login.css' %}" rel="stylesheet" />
    <link href="{% static 'usuarios/css/recuperar_password.css' %}" rel="stylesheet" />
  </head>
  <body>
    <div class="auth-wrap">
      <form class="form recuperar-form" method="post" novalidate>
        {% csrf_token %}
        <a href="{% url 'login' %}" class="auth-back-link">
          <i class="bi bi-arrow-left"></i> Volver a iniciar sesión
        </a>
        <p class="form-title">Recuperar contraseña</p>
        <p class="form-subtitle">
          Ingresa tu correo y te enviaremos un link para crear una nueva contraseña.
        </p>

        <label for="id_email" class="recuperar-label">Correo electrónico</label>
        <div class="recuperar-input-wrap">
          <input
            type="email"
            name="email"
            id="id_email"
            placeholder="nombre@gmail.com"
            value="{{ form.email.value|default:'' }}"
            required
          />
          <i class="bi bi-envelope"></i>
        </div>
        {% if form.email.errors %}
        <span class="field-error">{{ form.email.errors.0 }}</span>
        {% endif %}

        <button type="submit" class="submit">Enviar link</button>
      </form>
    </div>
  </body>
</html>
